<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>VibeUI workflow (en)</title>
  <rect width="1200" height="430" fill="#0d1117"/>

  <g font-family="-apple-system,'Segoe UI',sans-serif">
    <rect x="60" y="80" width="230" height="190" rx="14" fill="#161b22" stroke="#30363d"/>
    <circle cx="100" cy="120" r="16" fill="#378ADD"/>
    <text x="100" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
    <text x="126" y="126" font-size="19" font-weight="600" fill="#e6edf3">Explore</text>
    <text x="84" y="168" font-size="14" fill="#9aa4b2">Keyword + six-dim filters</text>
    <text x="84" y="192" font-size="14" fill="#9aa4b2">type / category / tech</text>
    <text x="84" y="216" font-size="14" fill="#9aa4b2">style / difficulty / features</text>
    <text x="84" y="248" font-family="monospace" font-size="12" fill="#7d8590">filters sync to the URL</text>

    <rect x="350" y="80" width="230" height="190" rx="14" fill="#161b22" stroke="#30363d"/>
    <circle cx="390" cy="120" r="16" fill="#534AB7"/>
    <text x="390" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
    <text x="416" y="126" font-size="19" font-weight="600" fill="#e6edf3">Preview</text>
    <text x="374" y="168" font-size="14" fill="#9aa4b2">Sandboxed iframe rendering</text>
    <text x="374" y="192" font-size="14" fill="#9aa4b2">device sizes / zoom / bg</text>
    <text x="374" y="216" font-size="14" fill="#9aa4b2">refresh / fullscreen</text>
    <text x="374" y="248" font-family="monospace" font-size="12" fill="#7d8590">animations pause offscreen</text>

    <rect x="640" y="80" width="230" height="190" rx="14" fill="#161b22" stroke="#30363d"/>
    <circle cx="680" cy="120" r="16" fill="#1D9E75"/>
    <text x="680" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
    <text x="706" y="126" font-size="19" font-weight="600" fill="#e6edf3">Edit &amp; take</text>
    <text x="664" y="168" font-size="14" fill="#9aa4b2">Edit source, preview follows</text>
    <text x="664" y="192" font-size="14" fill="#9aa4b2">One-click copy / project ZIP</text>
    <text x="664" y="216" font-size="14" fill="#9aa4b2">Standalone HTML / CodePen</text>
    <text x="664" y="248" font-family="monospace" font-size="12" fill="#7d8590">React + Vite scaffold</text>

    <rect x="930" y="80" width="230" height="190" rx="14" fill="#161b22" stroke="#30363d"/>
    <circle cx="970" cy="120" r="16" fill="#BA7517"/>
    <text x="970" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text>
    <text x="996" y="126" font-size="19" font-weight="600" fill="#e6edf3">AI prompt</text>
    <text x="954" y="168" font-size="14" fill="#9aa4b2">Bilingual terms + aliases</text>
    <text x="954" y="192" font-size="14" fill="#9aa4b2">3 levels × 3 frameworks</text>
    <text x="954" y="216" font-size="14" fill="#9aa4b2">Parameters + pitfalls</text>
    <text x="954" y="248" font-family="monospace" font-size="12" fill="#7d8590">paste &amp; reproduce</text>

    <path d="M290 175 L350 175" stroke="#5F5E5A" stroke-width="2" fill="none"/>
    <path d="M344 169 L350 175 L344 181" stroke="#5F5E5A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M580 175 L640 175" stroke="#5F5E5A" stroke-width="2" fill="none"/>
    <path d="M634 169 L640 175 L634 181" stroke="#5F5E5A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M870 175 L930 175" stroke="#5F5E5A" stroke-width="2" fill="none"/>
    <path d="M924 169 L930 175 L924 181" stroke="#5F5E5A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="60" y="330" width="1100" height="62" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="610" y="368" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="19" fill="#e6edf3">👀 Preview is truth — the code you copy is the code the preview rendered</text>
