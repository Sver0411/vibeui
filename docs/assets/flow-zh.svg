<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>VibeUI workflow (zh)</title>
  <rect width="1200" height="430" fill="#0d1117"/>

  <g font-family="-apple-system,'PingFang SC',sans-serif">
    <rect x="60" y="80" width="230" height="190" rx="14" fill="#161b22" stroke="#30363d"/>
    <circle cx="100" cy="120" r="16" fill="#378ADD"/>
    <text x="100" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
    <text x="126" y="126" font-size="19" font-weight="600" fill="#e6edf3">探索 Explore</text>
    <text x="84" y="168" font-size="14" fill="#9aa4b2">关键词 + 六维筛选</text>
    <text x="84" y="192" font-size="14" fill="#9aa4b2">类型/分类/技术栈/风格</text>
    <text x="84" y="216" font-size="14" fill="#9aa4b2">难度/特性</text>
    <text x="84" y="248" font-family="monospace" font-size="12" fill="#7d8590">筛选状态同步到 URL</text>

    <rect x="350" y="80" width="230" height="190" rx="14" fill="#161b22" stroke="#30363d"/>
    <circle cx="390" cy="120" r="16" fill="#534AB7"/>
    <text x="390" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
    <text x="416" y="126" font-size="19" font-weight="600" fill="#e6edf3">预览 Preview</text>
    <text x="374" y="168" font-size="14" fill="#9aa4b2">沙箱 iframe 实时渲染</text>
    <text x="374" y="192" font-size="14" fill="#9aa4b2">设备尺寸 / 缩放 / 背景</text>
    <text x="374" y="216" font-size="14" fill="#9aa4b2">刷新 / 全屏控制</text>
    <text x="374" y="248" font-family="monospace" font-size="12" fill="#7d8590">离屏自动暂停动画</text>

    <rect x="640" y="80" width="230" height="190" rx="14" fill="#161b22" stroke="#30363d"/>
    <circle cx="680" cy="120" r="16" fill="#1D9E75"/>
    <text x="680" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
    <text x="706" y="126" font-size="19" font-weight="600" fill="#e6edf3">取走 Take it</text>
    <text x="664" y="168" font-size="14" fill="#9aa4b2">在线编辑源码，预览即更</text>
    <text x="664" y="192" font-size="14" fill="#9aa4b2">一键复制 / 项目 ZIP</text>
    <text x="664" y="216" font-size="14" fill="#9aa4b2">单文件 HTML / CodePen</text>
    <text x="664" y="248" font-family="monospace" font-size="12" fill="#7d8590">React + Vite 脚手架</text>

    <rect x="930" y="80" width="230" height="190" rx="14" fill="#161b22" stroke="#30363d"/>
    <circle cx="970" cy="120" r="16" fill="#BA7517"/>
    <text x="970" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text>
    <text x="996" y="126" font-size="19" font-weight="600" fill="#e6edf3">AI 提示词 Prompt</text>
    <text x="954" y="168" font-size="14" fill="#9aa4b2">中英术语 + 别名</text>
    <text x="954" y="192" font-size="14" fill="#9aa4b2">三档提示词 × 三框架变体</text>
    <text x="954" y="216" font-size="14" fill="#9aa4b2">可调参数 + 避坑点</text>
    <text x="954" y="248" font-family="monospace" font-size="12" fill="#7d8590">贴给 AI 即可复现</text>

    <path d="M290 175 L350 175" stroke="#5F5E5A" stroke-width="2" fill="none"/>
    <path d="M344 169 L350 175 L344 181" stroke="#5F5E5A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M580 175 L640 175" stroke="#5F5E5A" stroke-width="2" fill="none"/>
    <path d="M634 169 L640 175 L634 181" stroke="#5F5E5A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M870 175 L930 175" stroke="#5F5E5A" stroke-width="2" fill="none"/>
    <path d="M924 169 L930 175 L924 181" stroke="#5F5E5A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="60" y="330" width="1100" height="62" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="610" y="368" text-anchor="middle" font-family="-apple-system,'PingFang SC',sans-serif" font-size="19" fill="#e6edf3">👀 预览即真实 —— 你复制到的代码，就是预览渲染的那一份</text>
</svg>
