<div class="sf-stage">
  <form class="sf-card" id="sf-form" novalidate>
    <h3 class="sf-title">订阅更新</h3>
    <div class="sf-field" id="sf-field">
      <label class="sf-label" for="sf-email">邮箱地址</label>
      <input class="sf-input" id="sf-email" type="email" placeholder="you@example.com" autocomplete="email" />
      <p class="sf-error" id="sf-error" role="alert" hidden></p>
    </div>
    <button type="submit" class="sf-submit">订阅</button>
    <p class="sf-success" id="sf-success" hidden role="status">✓ 订阅成功，欢迎加入！</p>
  </form>
  <p class="sf-hint">输入非法邮箱提交可看到横向抖动反馈；reduced-motion 下改为高亮提示。</p>
</div>
