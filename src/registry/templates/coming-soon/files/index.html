<div class="cs-stage">
  <span class="cs-badge">即将上线</span>
  <h1 class="cs-title">下一站，正在路上</h1>
  <p class="cs-text">我们在打磨一个更聪明的路径决策工具。留下邮箱，上线第一时间通知你。</p>

  <div class="cs-count" id="csCount" role="timer" aria-label="距上线倒计时">
    <div class="cs-cell"><strong class="cs-num" id="csDays">--</strong><span class="cs-unit">天</span></div>
    <div class="cs-cell"><strong class="cs-num" id="csHours">--</strong><span class="cs-unit">时</span></div>
    <div class="cs-cell"><strong class="cs-num" id="csMins">--</strong><span class="cs-unit">分</span></div>
    <div class="cs-cell"><strong class="cs-num" id="csSecs">--</strong><span class="cs-unit">秒</span></div>
  </div>

  <form class="cs-form" id="csForm" novalidate>
    <input class="cs-input" id="csEmail" type="email" placeholder="留下你的邮箱" aria-label="邮箱地址" autocomplete="email" />
    <button type="submit" class="cs-btn">通知我</button>
  </form>
  <p class="cs-hint" id="csHint" role="status" aria-live="polite"></p>

  <footer class="cs-foot">© 2026 VibeUI · 用心打磨每一个像素</footer>
</div>
