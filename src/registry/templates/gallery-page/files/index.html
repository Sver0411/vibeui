<div class="gl-stage">
  <header class="gl-head">
    <h1 class="gl-h1">作品集</h1>
    <p class="gl-sub">12 幅程序化渐变作品，点击放大查看。</p>
  </header>
  <div class="gl-grid" id="gl-grid"></div>

  <!-- 灯箱 -->
  <div class="gl-lightbox" id="gl-lightbox" role="dialog" aria-modal="true" aria-label="作品预览" hidden>
    <button type="button" class="gl-close" id="gl-close" aria-label="关闭预览">✕</button>
    <button type="button" class="gl-nav gl-prev" id="gl-prev" aria-label="上一幅">‹</button>
    <figure class="gl-figure">
      <div class="gl-art" id="gl-bigart"></div>
      <figcaption class="gl-caption" id="gl-caption"></figcaption>
    </figure>
    <button type="button" class="gl-nav gl-next" id="gl-next" aria-label="下一幅">›</button>
  </div>
</div>
