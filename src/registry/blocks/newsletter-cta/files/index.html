<div class="nl-stage">
  <section class="nl" id="nlBox">
    <div class="nl-copy">
      <span class="nl-badge">每周一封</span>
      <h2 class="nl-title">订阅 VibeUI 周刊</h2>
      <p class="nl-text">每周精选 3 个组件、1 段动效拆解，直达你的邮箱。</p>
    </div>
    <form class="nl-form" id="nlForm" novalidate>
      <div class="nl-field">
        <input class="nl-input" id="nlEmail" type="email" placeholder="you@example.com" aria-label="邮箱地址" autocomplete="email" />
        <button type="submit" class="nl-btn" id="nlBtn">订阅</button>
      </div>
      <p class="nl-hint" id="nlHint" role="status" aria-live="polite"></p>
    </form>
    <p class="nl-note">随时可退订 · 不发垃圾邮件</p>
  </section>
</div>
