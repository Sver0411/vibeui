<div class="ig-section">
  <header class="ig-head">
    <p class="ig-kicker">INTEGRATIONS</p>
    <h2 class="ig-title">与你的工具无缝协作</h2>
    <p class="ig-sub">30+ 官方集成，数据双向同步，无需重复配置。</p>
  </header>

  <div class="ig-grid">
    <div class="ig-tile" style="--ig-c: #0ea5e9;">
      <span class="ig-mark" aria-hidden="true">S</span>
      <div class="ig-body">
        <p class="ig-name">Slackify</p>
        <p class="ig-desc">消息提醒与日报机器人</p>
      </div>
      <span class="ig-state">已接入</span>
    </div>
    <div class="ig-tile" style="--ig-c: #16a34a;">
      <span class="ig-mark" aria-hidden="true">G</span>
      <div class="ig-body">
        <p class="ig-name">GitFlow</p>
        <p class="ig-desc">提交关联任务自动流转</p>
      </div>
      <span class="ig-state">已接入</span>
    </div>
    <div class="ig-tile" style="--ig-c: #7c3aed;">
      <span class="ig-mark" aria-hidden="true">F</span>
      <div class="ig-body">
        <p class="ig-name">Figma Sync</p>
        <p class="ig-desc">设计稿变更实时预览</p>
      </div>
      <span class="ig-state">已接入</span>
    </div>
    <div class="ig-tile" style="--ig-c: #d97706;">
      <span class="ig-mark" aria-hidden="true">C</span>
      <div class="ig-body">
        <p class="ig-name">Calendly</p>
        <p class="ig-desc">日程冲突自动协调</p>
      </div>
    </div>
    <div class="ig-tile" style="--ig-c: #dc2626;">
      <span class="ig-mark" aria-hidden="true">N</span>
      <div class="ig-body">
        <p class="ig-name">Notion Port</p>
        <p class="ig-desc">文档与知识库互通</p>
      </div>
    </div>
    <div class="ig-tile ig-tile--more">
      <span class="ig-plus" aria-hidden="true">+</span>
      <p class="ig-more-text">提交你想要的集成</p>
    </div>
  </div>
</div>
