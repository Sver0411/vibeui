<div class="tg-stage">
  <div class="tg-row">
    <label class="tg">
      <input type="checkbox" />
      <span class="tg-track"><span class="tg-thumb"></span></span>
      <span class="tg-label">开启通知</span>
    </label>
    <label class="tg">
      <input type="checkbox" checked />
      <span class="tg-track tg-track--icons"><span class="tg-thumb"></span><span class="tg-icon tg-icon--on">✓</span><span class="tg-icon tg-icon--off">✕</span></span>
      <span class="tg-label">自动同步</span>
    </label>
    <label class="tg tg--text">
      <input type="checkbox" checked />
      <span class="tg-track"><span class="tg-thumb tg-thumb--text"><span class="tg-text-on">ON</span><span class="tg-text-off">OFF</span></span></span>
    </label>
    <label class="tg">
      <input type="checkbox" disabled />
      <span class="tg-track"><span class="tg-thumb"></span></span>
      <span class="tg-label tg-label--muted">不可用</span>
    </label>
  </div>
  <p class="tg-hint">纯 CSS 开关：键盘可达，跟随 focus-visible 显示焦点环。</p>
</div>
