<div class="cb-stage">
  <div class="cb-demo">
    <div class="cb-bellwrap">
      <button type="button" class="cb-bell" id="cb-bell" aria-label="通知">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.7 21a2 2 0 0 1-3.4 0" />
        </svg>
        <span class="cb-badge" id="cb-badge" hidden>3</span>
      </button>
    </div>
    <div class="cb-actions">
      <button type="button" class="cb-btn" id="cb-inc">+1 通知</button>
      <button type="button" class="cb-btn" id="cb-add10">+10 通知</button>
      <button type="button" class="cb-btn cb-ghost" id="cb-clear">清空</button>
    </div>
    <p class="cb-live" id="cb-live" aria-live="polite"></p>
  </div>
  <p class="cb-hint">超过 99 显示 99+，数字变化时徽章跳动一次，归零自动隐藏。</p>
</div>
