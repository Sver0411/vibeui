<div class="bg-stage">
  <div class="bg-row">
    <span class="chip chip--active">进行中</span>
    <span class="chip chip--success">已发布</span>
    <span class="chip chip--warning">待审核</span>
    <span class="chip chip--danger">已失败</span>
    <span class="chip chip--neutral">草稿</span>
  </div>
  <div class="bg-row" id="removable-row">
    <span class="chip chip--removable">设计<input type="button" value="×" aria-label="移除 设计" /></span>
    <span class="chip chip--removable">前端<input type="button" value="×" aria-label="移除 前端" /></span>
    <span class="chip chip--removable">动效<input type="button" value="×" aria-label="移除 动效" /></span>
  </div>
  <div class="bg-row">
    <span class="dot dot--success"></span>
    <span class="dot dot--warning"></span>
    <span class="dot dot--danger"></span>
    <span class="dot-label">状态圆点：在线 · 离开 · 忙碌</span>
  </div>
  <p class="bg-hint">点击标签上的 × 可移除；圆点带呼吸动画。</p>
</div>
