<div class="sg-stage">
  <div class="sg-case">
    <p class="sg-caption">标准 · 滑块跟随选中项</p>
    <div class="sg" data-segmented>
      <span class="sg-thumb" aria-hidden="true"></span>
      <label class="sg-item">
        <input type="radio" name="sg-basic" value="overview" checked />
        <span class="sg-text">概览</span>
      </label>
      <label class="sg-item">
        <input type="radio" name="sg-basic" value="analysis" />
        <span class="sg-text">分析</span>
      </label>
      <label class="sg-item">
        <input type="radio" name="sg-basic" value="archive" />
        <span class="sg-text">归档</span>
      </label>
    </div>
  </div>

  <div class="sg-case">
    <p class="sg-caption">带计数徽章 · 原生 radio 支持方向键</p>
    <div class="sg" data-segmented>
      <span class="sg-thumb" aria-hidden="true"></span>
      <label class="sg-item">
        <input type="radio" name="sg-count" checked />
        <span class="sg-text">收件箱 <em class="sg-count">128</em></span>
      </label>
      <label class="sg-item">
        <input type="radio" name="sg-count" />
        <span class="sg-text">待处理 <em class="sg-count">12</em></span>
      </label>
      <label class="sg-item">
        <input type="radio" name="sg-count" />
        <span class="sg-text">已完成 <em class="sg-count">3.2k</em></span>
      </label>
    </div>
  </div>

  <div class="sg-case sg-case--wide">
    <p class="sg-caption">全宽等分 · 移动端常见的紧凑尺寸</p>
    <div class="sg sg--block" data-segmented>
      <span class="sg-thumb" aria-hidden="true"></span>
      <label class="sg-item">
        <input type="radio" name="sg-block" checked />
        <span class="sg-text">日</span>
      </label>
      <label class="sg-item">
        <input type="radio" name="sg-block" />
        <span class="sg-text">周</span>
      </label>
      <label class="sg-item">
        <input type="radio" name="sg-block" />
        <span class="sg-text">月</span>
      </label>
      <label class="sg-item">
        <input type="radio" name="sg-block" />
        <span class="sg-text">年</span>
      </label>
    </div>
  </div>
</div>
