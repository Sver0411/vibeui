<div class="lp-demo">
  <div class="lp" role="progressbar" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100" aria-label="Upload progress">
    <div class="lp__header">
      <span class="lp__title">Uploading assets</span>
      <span class="lp__value" id="lp-value">64%</span>
    </div>
    <div class="lp__track">
      <div class="lp__fill" id="lp-fill" style="width: 64%"></div>
    </div>
  </div>

  <div class="lp" role="progressbar" aria-label="Processing">
    <div class="lp__header">
      <span class="lp__title">Indeterminate</span>
    </div>
    <div class="lp__track">
      <div class="lp__fill lp__fill--indeterminate"></div>
    </div>
  </div>

  <button class="lp-restart" id="lp-restart" type="button">Replay 0 → 100</button>
</div>
