<div class="cs-shell" id="cs-shell">
  <aside class="cs" data-collapsed="false">
    <div class="cs__top">
      <span class="cs__brand" aria-hidden="true">
        <svg viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" rx="5" fill="currentColor" opacity="0.9"/><circle cx="10" cy="10" r="3.4" fill="#fff"/></svg>
      </span>
      <span class="cs__brand-name">Nimbus</span>
    </div>
    <nav class="cs__nav" aria-label="Sidebar">
      <a class="cs__item cs__item--active" href="#" onclick="return false" data-tip="Dashboard">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5"/></svg>

      </a>
      <a class="cs__item" href="#" onclick="return false" data-tip="Projects">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h3l2 2h5a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z"/></svg>
        <span class="cs__label">Projects</span>
      </a>
      <a class="cs__item" href="#" onclick="return false" data-tip="Reports">

        <span class="cs__label">Reports</span>
      </a>
      <a class="cs__item" href="#" onclick="return false" data-tip="Team">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7.5" cy="7" r="2.6"/><path d="M2.8 16c.6-2.6 2.5-4 4.7-4s4.1 1.4 4.7 4"/><circle cx="14.4" cy="8" r="2"/><path d="M14.6 12.4c1.6.3 2.7 1.4 3 3.1"/></svg>

        <span class="cs__label">Settings</span>
      </a>

    <button class="cs__toggle" id="cs-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true">
      <svg class="cs__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 4-4 4 4 4"/></svg>
    </button>
  </aside>
  <main class="cs-main">
    <h1 class="cs-main__title">Dashboard</h1>
    <p class="cs-main__text">Click the chevron (bottom) to collapse the sidebar. Collapsed items show tooltips on hover.</p>
    <p class="cs-main__text">Active item, icon buttons and labels are all real accessible elements.</p>
    <p class="cs-main__text">Width transitions are animated with CSS custom properties.</p>
  </main>
</div>
