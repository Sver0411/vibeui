<div class="fd-stage">
  <p class="fd-hint">Hover the dock — icons scale by distance to the cursor.</p>
  <nav class="fd" id="fd" aria-label="Applications">
    <button class="fd__item" type="button" data-tip="Finder" aria-label="Finder" data-active="false"><span class="fd__glyph" style="--c1:#8ab4ff;--c2:#3b6fe0"></span></button>
    <button class="fd__item" type="button" data-tip="Messages" aria-label="Messages"><span class="fd__glyph" style="--c1:#7ce8b0;--c2:#18a558"></span></button>
    <button class="fd__item" type="button" data-tip="Photos" aria-label="Photos" data-active="true"><span class="fd__glyph" style="--c1:#ffd27c;--c2:#f09a3e"></span></button>
    <button class="fd__item" type="button" data-tip="Music" aria-label="Music"><span class="fd__glyph" style="--c1:#ff9db4;--c2:#e0447a"></span></button>
    <button class="fd__item" type="button" data-tip="Calendar" aria-label="Calendar"><span class="fd__glyph" style="--c1:#c4b5fd;--c2:#7c5ce0"></span></button>
    <button class="fd__item" type="button" data-tip="Settings" aria-label="Settings"><span class="fd__glyph" style="--c1:#b9c0cc;--c2:#6b7280"></span></button>
  </nav>
</div>
