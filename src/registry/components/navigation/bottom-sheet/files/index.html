<div class="bs-stage" id="bsStage">
  <button type="button" class="bs-open" id="bsOpen">打开底部弹层</button>
  <p class="bs-caption">下拉把手超过 90px 或快速下滑即可关闭</p>

  <div class="bs-layer" id="bsLayer" hidden>
    <div class="bs-mask" id="bsMask"></div>
    <section class="bs-sheet" role="dialog" aria-modal="true" aria-label="分享面板">
      <div class="bs-grip" id="bsGrip" aria-hidden="true"><i></i></div>
      <h2 class="bs-title">分享到</h2>
      <div class="bs-grid">
        <button type="button" class="bs-item"><i class="bs-ico bs-ico--teal">链</i><span>复制链接</span></button>
        <button type="button" class="bs-item"><i class="bs-ico bs-ico--green">微</i><span>微信</span></button>
        <button type="button" class="bs-item"><i class="bs-ico bs-ico--rose">微</i><span>微博</span></button>
        <button type="button" class="bs-item"><i class="bs-ico bs-ico--amber">图</i><span>存为图片</span></button>
      </div>
      <button type="button" class="bs-cancel" id="bsCancel">取消</button>
    </section>
  </div>
</div>
