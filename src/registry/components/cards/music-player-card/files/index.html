<div class="mp-stage">
  <div class="mp-card" id="mp-card">
    <div class="mp-art" id="mp-art">
      <div class="mp-vinyl" aria-hidden="true"><i></i></div>
    </div>
    <div class="mp-info">
      <h3 class="mp-title">夜航星</h3>
      <p class="mp-artist">Vibe 合成器乐队</p>
    </div>
    <div class="mp-progress" id="mp-progress" role="slider" aria-label="播放进度"
      aria-valuemin="0" aria-valuemax="222" aria-valuenow="0" aria-valuetext="0:00 / 3:42" tabindex="0">
      <div class="mp-rail"><div class="mp-fill" id="mp-fill"></div></div>
      <span class="mp-time mp-time-cur" id="mp-cur">0:00</span>
      <span class="mp-time mp-time-total">3:42</span>
    </div>
    <div class="mp-controls">
      <button type="button" class="mp-skip" id="mp-prev" aria-label="上一首">⏮</button>
      <button type="button" class="mp-play" id="mp-play" aria-label="播放" aria-pressed="false">▶</button>
      <button type="button" class="mp-skip" id="mp-next" aria-label="下一首">⏭</button>
      <button type="button" class="mp-like" id="mp-like" aria-label="喜欢" aria-pressed="false">♡</button>
    </div>
  </div>
  <p class="mp-hint">点击播放后封面开始旋转，进度条可拖拽定位。</p>
</div>
