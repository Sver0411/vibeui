<div class="pc-stage">
  <article class="pc-card">
    <div class="pc-card__media">
      <div class="pc-visual pc-visual--one" aria-hidden="true">
        <span class="pc-visual__shape"></span>
      </div>
      <span class="pc-card__flag">New</span>
    </div>
    <div class="pc-card__body">
      <div class="pc-card__row">
        <h3 class="pc-card__name">Ceramic Pour-over Set</h3>
        <span class="pc-card__price">$64</span>
      </div>
      <div class="pc-card__rating" aria-label="Rated 4.8 out of 5 from 132 reviews">
        <span aria-hidden="true">★★★★★</span>
        <span class="pc-card__rating-count">4.8 (132)</span>
      </div>
      <div class="pc-card__sizes" role="radiogroup" aria-label="Size">
        <button class="pc-size" type="button" role="radio" aria-checked="true">S</button>
        <button class="pc-size" type="button" role="radio" aria-checked="false">M</button>
        <button class="pc-size" type="button" role="radio" aria-checked="false">L</button>
      </div>
      <button class="pc-card__add" id="pc-add" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
        <span id="pc-add-label">Add to cart</span>
      </button>
    </div>
  </article>
</div>
