<div class="cs-stage">
  <div class="cs-card">
    <div class="cs-tabs" role="tablist" aria-label="代码文件">
      <button type="button" class="cs-tab active" role="tab" aria-selected="true" data-tab="html">HTML</button>
      <button type="button" class="cs-tab" role="tab" aria-selected="false" data-tab="css">CSS</button>
      <button type="button" class="cs-tab" role="tab" aria-selected="false" data-tab="js">JS</button>
      <button type="button" class="cs-copy" id="cs-copy" aria-label="复制当前代码">复制</button>
    </div>
    <pre class="cs-code" id="cs-code" role="tabpanel"><code></code></pre>
  </div>
  <p class="cs-hint">标签页切换文件内容，右上角一键复制（非安全上下文自动降级 execCommand）。</p>
</div>
