<div class="ep-stage">
  <div class="ep-card" id="ep-card">
    <div class="ep-head">
      <input class="ep-search" id="ep-search" type="search" placeholder="搜索表情…" aria-label="搜索表情" />
      <button type="button" class="ep-close" id="ep-close" aria-label="关闭">✕</button>
    </div>
    <div class="ep-cats" role="tablist" aria-label="表情分类" id="ep-cats"></div>
    <div class="ep-grid" id="ep-grid" role="listbox" aria-label="表情列表"></div>
    <div class="ep-foot">
      <span class="ep-recent-label">最近使用</span>
      <div class="ep-recent" id="ep-recent"></div>
    </div>
  </div>
  <p class="ep-hint">点击表情即选中（下方回显），支持分类切换与关键词搜索。</p>
  <p class="ep-picked" id="ep-picked" aria-live="polite"></p>
</div>
