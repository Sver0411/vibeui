<div class="cbx-stage">
  <div class="cbx-demo">
    <label class="cbx-label" for="cbx-input">选择部署区域</label>
    <div class="cbx">
      <input class="cbx-input" id="cbx-input" type="text" role="combobox"
        aria-expanded="false" aria-controls="cbx-list" aria-autocomplete="list"
        placeholder="输入城市或拼音筛选…" autocomplete="off" />
      <svg class="cbx-chevron" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 11 3.5 6.5 4.56 5.44 8 8.88l3.44-3.44 1.06 1.06L8 11Z"/></svg>
      <ul class="cbx-list" id="cbx-list" role="listbox" aria-label="部署区域建议" hidden></ul>
    </div>
    <p class="cbx-hint">↑↓ 选择 · Enter 确认 · Esc 关闭</p>
  </div>
</div>
