<div class="fl-stage">
  <form class="fl-form" onsubmit="return false">
    <div class="fl-field">
      <input class="fl-input" type="email" id="fl-email" placeholder=" " autocomplete="email" />
      <label class="fl-label" for="fl-email">Email address</label>
    </div>
    <div class="fl-field">
      <input class="fl-input" type="password" id="fl-password" placeholder=" " autocomplete="current-password" />
      <label class="fl-label" for="fl-password">Password</label>
    </div>
    <p class="fl-hint">The label moves using :placeholder-shown — no JS needed.</p>
  </form>
</div>
