<div class="np-stage">
  <div class="np-card">
    <p class="np-question">你有多大可能把 VibeUI 推荐给同事？</p>

    <div class="np-row">
      <span class="np-end">绝不</span>
      <div class="np-group" role="radiogroup" aria-label="0 到 10 分" id="np-group"></div>
    </div>

    <div class="np-legend" aria-hidden="true">
      <span class="np-legend-item"><i class="np-legend-dot np-legend-dot--bad"></i>0-6 贬损者</span>
      <span class="np-legend-item"><i class="np-legend-dot np-legend-dot--mid"></i>7-8 中立者</span>
      <span class="np-legend-item"><i class="np-legend-dot np-legend-dot--good"></i>9-10 推荐者</span>
    </div>

    <div class="np-followup" id="np-followup">
      <div class="np-followup-inner">
        <label class="np-followup-label" for="np-text" id="np-followup-label">告诉我们原因（选填）</label>
        <textarea class="np-text" id="np-text" rows="2" placeholder="随便写点…"></textarea>
        <button class="np-submit" id="np-submit" type="button" disabled>提交反馈</button>
      </div>
    </div>
  </div>
</div>
