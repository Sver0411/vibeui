<div class="cl-stage">
  <div class="cl-case">
    <p class="cl-caption">可交互 · 点击选色 · 键盘可用 · 预览与色值联动</p>
    <div class="cl-pick" id="clPick">
      <div class="cl-swatches" role="radiogroup" aria-label="选择颜色">
        <button type="button" class="cl-swatch" role="radio" aria-checked="true" data-hex="#0f766e" data-name="松石绿" style="--c: #0f766e" aria-label="松石绿 #0f766e"></button>
        <button type="button" class="cl-swatch" role="radio" aria-checked="false" data-hex="#0ea5e9" data-name="晴空蓝" style="--c: #0ea5e9" aria-label="晴空蓝 #0ea5e9"></button>
        <button type="button" class="cl-swatch" role="radio" aria-checked="false" data-hex="#8b5cf6" data-name="鸢尾紫" style="--c: #8b5cf6" aria-label="鸢尾紫 #8b5cf6"></button>
        <button type="button" class="cl-swatch" role="radio" aria-checked="false" data-hex="#ec4899" data-name="蔷薇粉" style="--c: #ec4899" aria-label="蔷薇粉 #ec4899"></button>
        <button type="button" class="cl-swatch" role="radio" aria-checked="false" data-hex="#f59e0b" data-name="琥珀黄" style="--c: #f59e0b" aria-label="琥珀黄 #f59e0b"></button>
        <button type="button" class="cl-swatch" role="radio" aria-checked="false" data-hex="#e11d48" data-name="绯红" style="--c: #e11d48" aria-label="绯红 #e11d48"></button>
        <button type="button" class="cl-swatch" role="radio" aria-checked="false" data-hex="#16a34a" data-name="苔绿" style="--c: #16a34a" aria-label="苔绿 #16a34a"></button>
        <button type="button" class="cl-swatch" role="radio" aria-checked="false" data-hex="#18181b" data-name="墨黑" style="--c: #18181b" aria-label="墨黑 #18181b"></button>
      </div>
      <div class="cl-preview">
        <span class="cl-dot" id="clDot" style="--c: #0f766e"></span>
        <div class="cl-meta">
          <strong class="cl-name" id="clName">松石绿</strong>
          <code class="cl-hex" id="clHex">#0f766e</code>
        </div>
      </div>
    </div>
  </div>

  <div class="cl-case">
    <p class="cl-caption">应用示例 · 选中色驱动按钮与徽章</p>
    <div class="cl-demo">
      <button type="button" class="cl-btn" id="clBtn">使用该色</button>
      <span class="cl-badge" id="clBadge">新色上线</span>
    </div>
  </div>
</div>
