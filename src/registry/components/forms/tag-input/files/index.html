<div class="ti-stage">

    <div class="ti-field" id="tiField">
      <span class="ti-chip">
        前端

          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" /></svg>
        </button>
      </span>
      <span class="ti-chip">
        设计

  <div class="ti-case">
