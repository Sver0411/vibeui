<div class="at-stage">
  <div class="at-case">
    <p class="at-caption">可交互 · 随内容自动增高 · 超高后内部滚动</p>
    <div class="at-wrap" id="atWrap">
      <textarea class="at-area" id="atArea" rows="3" placeholder="输入多行内容试试，高度会自动跟随…"></textarea>
      <span class="at-count" id="atCount">0 / 200</span>
    </div>
  </div>

  <div class="at-case">
    <p class="at-caption">带错误反馈 · 超出上限不再增高并提示</p>
    <div class="at-wrap at-wrap--error" id="atWrap2">
      <textarea class="at-area" id="atArea2" rows="2" maxlength="30" placeholder="最多 30 个字"></textarea>
      <span class="at-count" id="atCount2">0 / 30</span>
    </div>
    <p class="at-hint" id="atHint" role="status" aria-live="polite"></p>
  </div>
</div>
