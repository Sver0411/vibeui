<div class="si-stage">
  <div class="si" id="si">
    <div class="si__row">
      <svg class="si__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m11 11 3 3"/></svg>
      <input class="si__input" id="si-input" type="text" placeholder="Search components, docs, people…" autocomplete="off" aria-label="Search" aria-expanded="false" role="combobox" aria-controls="si-results" />
      <button class="si__clear" id="si-clear" type="button" aria-label="Clear search" hidden>&times;</button>
    </div>
    <div class="si__results" id="si-results" role="listbox" hidden></div>
    <div class="si__recent" id="si-recent">
      <p class="si__recent-title">Recent</p>
      <div class="si__chips">
        <button class="si__chip" type="button" data-query="tables">tables</button>
        <button class="si__chip" type="button" data-query="onboarding">onboarding</button>
        <button class="si__chip" type="button" data-query="dark theme">dark theme</button>
      </div>
    </div>
  </div>
  <p class="si-hint">Type to search — arrow keys navigate, Enter selects, Esc closes.</p>
</div>
