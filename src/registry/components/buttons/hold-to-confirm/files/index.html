<div class="hold-demo">
  <button class="hold-button" id="hold-button" type="button">
    <svg class="hold-button__ring" viewBox="0 0 48 48" aria-hidden="true">
      <circle class="hold-button__ring-track" cx="24" cy="24" r="22" />
      <circle class="hold-button__ring-progress" cx="24" cy="24" r="22" pathLength="100" />
    </svg>
    <span class="hold-button__label">Hold to delete</span>
  </button>
  <p class="hold-demo__hint" id="hold-status" aria-live="polite">Press and hold for one second.</p>
</div>
